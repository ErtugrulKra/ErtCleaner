name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate cleaner rules
        run: npm run validate:rules

      - name: Validate release documentation
        run: npm run validate:release-docs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: test-results/junit.xml
          if-no-files-found: ignore
